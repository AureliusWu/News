name: Public News release verification
on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact deployed candidate application source
        required: true
        type: string
      run_performance:
        description: Preserve ten separate cold startup samples in addition to navigation
        type: boolean
        default: true
      expected_release_status:
        description: Exact public channel; formal status requires its committed approval receipt
        type: choice
        options:
          - CANDIDATE
          - RELEASED_WITH_WARNINGS
          - RELEASED
        default: CANDIDATE
permissions:
  contents: read
concurrency:
  group: news-public-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
      RUN_PUBLIC_PERFORMANCE: ${{ inputs.run_performance }}
      EXPECTED_RELEASE_STATUS: ${{ inputs.expected_release_status }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/browser/package-lock.json
      - run: npm ci --prefix scripts/browser
      - name: Actual public browser and ten cold startup samples
        run: |
          export CHROME_PATH="$(command -v google-chrome)"
          node scripts/browser/public.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/public-verification/
          retention-days: 14
          if-no-files-found: error
