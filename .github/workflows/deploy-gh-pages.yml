name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          PAGES_DEPLOY_ENABLED: ${{ vars.PAGES_DEPLOY_ENABLED }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            BASE_PATH="/"
          else
            BASE_PATH="/$REPO_NAME/"
          fi
          export BASE_PATH

          if [[ "$PAGES_DEPLOY_ENABLED" != "true" ]]; then
            echo "Pages publication is paused; build only." >> "$GITHUB_STEP_SUMMARY"
            export VITE_API_BASE_URL=""
          else
            node --input-type=module <<'NODE'
          import { isIP } from 'node:net';
          const api = new URL(process.env.VITE_API_BASE_URL || '');
          const host = api.hostname.replace(/^\[|\]$/g, '').toLowerCase();
          const local = isIP(host) !== 0 || !host.includes('.') ||
            /(^|\.)(localhost|local|internal|invalid|test|example)$/.test(host) ||
            /(^|\.)example\.(com|net|org)$/.test(host);
          if (api.protocol !== 'https:' || local || api.username || api.password || api.search || api.hash) {
            throw new Error('Pages requires a public HTTPS backend hostname without credentials, query or fragment.');
          }
          NODE
          fi

          npm run build -- --base "$BASE_PATH"
          cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    if: ${{ vars.PAGES_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
