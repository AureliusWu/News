name: Deploy Frontend to GitHub Pages
run-name: News Pages ${{ inputs.source_ref || github.ref_name }} - ${{ inputs.data_only && 'data-only' || github.event_name }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after all data and build gates pass
        type: boolean
        default: true
      data_only:
        description: Restore the verified deployed app at this exact source and publish only new gated data
        type: boolean
        default: false
      source_ref:
        description: Exact application tag/ref to check out while deployment remains on the protected main workflow
        type: string
        default: ''
      formal_release:
        description: Build the fixed application with its separately approved version/source-bound receipt
        type: boolean
        default: false
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'schedule' || (vars.PAGES_DATA_MODE == 'snapshot' && vars.PAGES_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PAGES_DATA_MODE: ${{ vars.PAGES_DATA_MODE || 'api' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Record actual checked-out application source
        run: echo "NEWS_SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Checkout the reviewed release control record
        if: inputs.formal_release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: artifacts/release-control
          persist-credentials: false
          sparse-checkout: |
            scripts
            docs/releases
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate the separately approved formal release receipt
        if: inputs.formal_release
        run: |
          test "${{ inputs.data_only }}" != 'true'
          version="$(node -p "require('./frontend/package.json').version")"
          node --test artifacts/release-control/scripts/release-receipt.test.mjs
          node artifacts/release-control/scripts/release-receipt.mjs --receipt "artifacts/release-control/docs/releases/V${version}_ACCEPTANCE.json" --version "$version" --revision "$NEWS_SOURCE_REVISION" --output artifacts/release-acceptance.json
          echo "NEWS_RELEASE_ACCEPTANCE_FILE=$GITHUB_WORKSPACE/artifacts/release-acceptance.json" >> "$GITHUB_ENV"
      - name: Check disabled AI policy and independent release-gate rules
        run: |
          tests=(scripts/release-gates.test.mjs scripts/release-approval.test.mjs)
          if [[ -f scripts/observation-recovery.test.mjs ]]; then
            tests+=(scripts/observation-recovery.test.mjs)
          fi
          node --test "${tests[@]}"
      - name: Setup Python for free snapshot publishing
        if: env.PAGES_DATA_MODE == 'snapshot'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/snapshot/requirements.txt
      - name: Install snapshot dependencies
        if: env.PAGES_DATA_MODE == 'snapshot'
        run: python -m pip install --disable-pip-version-check -r scripts/snapshot/requirements.txt
      - name: Test snapshot normalization and publication gates
        if: env.PAGES_DATA_MODE == 'snapshot'
        run: python -m unittest discover -s scripts/snapshot -p 'test_*.py' -v
      - name: Collect real news and enforce source/freshness gates
        if: env.PAGES_DATA_MODE == 'snapshot'
        run: |
          python scripts/snapshot/restore_state.py
          python scripts/snapshot/collect.py
      - name: Restore deployed code for scheduled data refresh
        id: cached_app
        if: (github.event_name == 'schedule' || inputs.data_only) && env.PAGES_DATA_MODE == 'snapshot'
        run: |
          if [[ "${{ inputs.data_only }}" == 'true' ]]; then
            python scripts/snapshot/app_bundle.py restore --expected-revision "$NEWS_SOURCE_REVISION"
            test -s frontend/dist/release.json
          else
            python scripts/snapshot/app_bundle.py restore
          fi
      - name: Install frontend dependencies
        if: steps.cached_app.outputs.restored != 'true'
        working-directory: frontend
        run: npm ci
      - name: Test frontend and snapshot adapter
        if: steps.cached_app.outputs.restored != 'true'
        working-directory: frontend
        run: npm test -- --run
      - name: Check Vue and TypeScript types
        if: steps.cached_app.outputs.restored != 'true'
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        if: steps.cached_app.outputs.restored != 'true'
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          PAGES_DEPLOY_ENABLED: ${{ vars.PAGES_DEPLOY_ENABLED }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            BASE_PATH="/"
          else
            BASE_PATH="/$REPO_NAME/"
          fi
          if [[ "$PAGES_DATA_MODE" == "snapshot" ]]; then
            export VITE_API_BASE_URL=""
            export VITE_NEWS_MODE="snapshot"
            test -s public/data/news.json
            echo "Free snapshot mode: real RSS data, no public backend required." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$PAGES_DEPLOY_ENABLED" != "true" ]]; then
            export VITE_API_BASE_URL=""
            echo "API website publication is paused; build only." >> "$GITHUB_STEP_SUMMARY"
          else
            node --input-type=module <<'NODE'
          import { isIP } from 'node:net';
          const api = new URL(process.env.VITE_API_BASE_URL || '');
          const host = api.hostname.replace(/^\[|\]$/g, '').toLowerCase();
          const local = isIP(host) !== 0 || !host.includes('.') ||
            /(^|\.)(localhost|local|internal|invalid|test|example)$/.test(host) ||
            /(^|\.)example\.(com|net|org)$/.test(host);
          if (api.protocol !== 'https:' || local || api.username || api.password || api.search || api.hash) {
            throw new Error('API mode requires a public HTTPS backend hostname.');
          }
          NODE
          fi
          GITHUB_SHA="$NEWS_SOURCE_REVISION" node ../scripts/write-release.mjs
          npm run build -- --base "$BASE_PATH"
          node ../scripts/verify-pwa-build.mjs dist "$BASE_PATH"
          cp dist/index.html dist/404.html
          if [[ "$PAGES_DATA_MODE" == "snapshot" ]]; then
            python ../scripts/snapshot/app_bundle.py pack --directory dist --base "$BASE_PATH"
          fi
      - name: Overlay fresh data on the verified application
        if: steps.cached_app.outputs.restored == 'true'
        run: python scripts/snapshot/app_bundle.py overlay
      - name: Verify formal metadata against the approved receipt
        if: inputs.formal_release
        run: |
          version="$(node -p "require('./frontend/package.json').version")"
          node artifacts/release-control/scripts/release-receipt.mjs --receipt artifacts/release-acceptance.json --version "$version" --revision "$NEWS_SOURCE_REVISION" --public frontend/dist/release.json --release-status RELEASED_WITH_WARNINGS
      - name: Preserve the exact release acceptance record
        if: always() && inputs.formal_release
        uses: actions/upload-artifact@v4
        with:
          name: formal-release-acceptance
          path: artifacts/release-acceptance.json
          retention-days: 14
          if-no-files-found: warn
      - name: Upload source-health evidence
        if: always() && env.PAGES_DATA_MODE == 'snapshot'
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-source-health
          path: artifacts/pages-source-health.json
          retention-days: 8
          if-no-files-found: ignore
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
          retention-days: 8

  deploy:
    needs: build
    if: vars.PAGES_DEPLOY_ENABLED == 'true' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
