name: Restore Paired News Pages Artifact

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed successful main publisher run whose exact app and data should be restored
        required: false
        type: string
      frozen_baseline:
        description: Committed original-byte capsule, used only when its original Actions artifact expired
        required: false
        type: choice
        default: ''
        options:
          - ''
          - v0.2-20261001

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      FROZEN_BASELINE: ${{ inputs.frozen_baseline }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test bounded exact restoration
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Recover the original application and original data without collecting
        run: |
          if [[ -n "$SOURCE_RUN_ID" && -z "$FROZEN_BASELINE" ]]; then
            python scripts/restore-pages-artifact.py --run "$SOURCE_RUN_ID" --output artifacts/restored-pages --report artifacts/restore-report.json
          elif [[ -n "$FROZEN_BASELINE" && -z "$SOURCE_RUN_ID" ]]; then
            python scripts/restore-pages-artifact.py --baseline "$FROZEN_BASELINE" --output artifacts/restored-pages --report artifacts/restore-report.json
          else
            echo 'Choose exactly one verified source run or committed frozen baseline.' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: paired-restore-evidence
          path: artifacts/restore-report.json
          retention-days: 8
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/restored-pages
          retention-days: 8

  deploy:
    needs: restore
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
