name: Independent News Freshness Observer

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Published candidate version to evaluate; empty uses the pinned repository variable
        type: string
      expected_revision:
        description: Exact application source SHA; empty uses the pinned repository variable
        type: string
  schedule:
    - cron: '8,38 * * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: news-independent-observer
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      OBSERVER_VERSION: ${{ inputs.expected_version || vars.NEWS_OBSERVER_VERSION || '1.0.0' }}
      OBSERVER_REVISION: ${{ inputs.expected_revision || vars.NEWS_OBSERVER_REVISION || '31cf95d6ae471bb961eb5b85a334ec78f4cce260' }}
      NEWS_OBSERVER_CONTINUOUS: ${{ vars.NEWS_OBSERVER_CONTINUOUS || 'false' }}
      NEWS_AUTO_RECOVERY_ENABLED: ${{ vars.NEWS_AUTO_RECOVERY_ENABLED || 'false' }}
      NEWS_RECOVERY_REF: ${{ vars.NEWS_RECOVERY_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test report binding and freshness rules before observation
        run: node --test scripts/release-gates.test.mjs scripts/observation-recovery.test.mjs
      - name: Restore the last completed observer history, including failed samples
        id: history
        run: |
          mkdir -p artifacts/v1-cloud-observer/incoming
          node scripts/restore-observation-history.mjs
      - name: Directly observe public HTML, snapshot, report and release metadata
        if: ${{ always() && steps.history.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/watch-public.mjs
      - name: Preserve one direct observation when history recovery failed
        if: ${{ always() && steps.history.outcome != 'success' }}
        continue-on-error: true
        run: node scripts/observe-public.mjs artifacts/v1-cloud-observer/incoming
      - name: Evaluate real candidate-bound seven-day coverage
        if: ${{ always() && steps.history.outcome == 'success' }}
        run: |
          node scripts/freshness-gate.mjs --input artifacts/v1-cloud-observer/incoming --history artifacts/v1-cloud-observer/history.json --output artifacts/v1-cloud-observer/report.json --expected-version "$OBSERVER_VERSION" --expected-revision "$OBSERVER_REVISION" --collect-only
          echo 'Independent HTTP evidence; green job status is not a seven-day gate pass.' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/v1-cloud-observer/report.json >> "$GITHUB_STEP_SUMMARY"
      - name: Save bounded independent history
        if: ${{ always() && steps.history.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: news-independent-observations
          path: |
            artifacts/v1-cloud-observer/history.json
            artifacts/v1-cloud-observer/report.json
          retention-days: 14
          if-no-files-found: error
      - name: Preserve this run's raw observation even when history recovery fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-independent-raw-observation
          path: artifacts/v1-cloud-observer/incoming/
          retention-days: 14
          if-no-files-found: error
