name: Isolated browser and startup verification

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Previous application revision
        required: true
        default: 31cf95d6ae471bb961eb5b85a334ec78f4cce260
      candidate_ref:
        description: Candidate application revision
        required: true
        default: main
      run_performance:
        description: Run the separate frozen-input performance diagnostic
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: isolated-browser-verification
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VERIFICATION_OUTPUT: ${{ github.workspace }}/artifacts/ci-browser-verification
      BASELINE_ROOT: ${{ github.workspace }}/verification-inputs/baseline
      CANDIDATE_ROOT: ${{ github.workspace }}/verification-inputs/candidate
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.baseline_ref }}
          path: verification-inputs/baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
          path: verification-inputs/candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            scripts/browser/package-lock.json
            verification-inputs/baseline/frontend/package-lock.json
            verification-inputs/candidate/frontend/package-lock.json
      - name: Install isolated test and application dependencies
        run: |
          npm ci --prefix scripts/browser
          npm ci --prefix verification-inputs/baseline/frontend
          npm ci --prefix verification-inputs/candidate/frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Candidate Python dependencies
        run: |
          python -m venv "$RUNNER_TEMP/news-backend-venv"
          "$RUNNER_TEMP/news-backend-venv/bin/python" -m pip install -r verification-inputs/candidate/backend/requirements.txt
          python -m venv "$RUNNER_TEMP/news-snapshot-venv"
          "$RUNNER_TEMP/news-snapshot-venv/bin/python" -m pip install -r verification-inputs/candidate/scripts/snapshot/requirements.txt
      - name: Current release and candidate regression checks
        run: |
          mkdir -p "$VERIFICATION_OUTPUT/regression"
          set -o pipefail
          node --test scripts/release-gates.test.mjs scripts/release-approval.test.mjs scripts/observation-recovery.test.mjs 2>&1 | tee "$VERIFICATION_OUTPUT/regression/node.txt"
          npm --prefix verification-inputs/candidate/frontend test 2>&1 | tee "$VERIFICATION_OUTPUT/regression/frontend.txt"
          npm --prefix verification-inputs/candidate/frontend run typecheck 2>&1 | tee "$VERIFICATION_OUTPUT/regression/typecheck.txt"
          cd verification-inputs/candidate
          "$RUNNER_TEMP/news-backend-venv/bin/python" -m pytest backend/tests -q -ra 2>&1 | tee "$VERIFICATION_OUTPUT/regression/backend.txt"
          "$RUNNER_TEMP/news-snapshot-venv/bin/python" -m unittest discover -s scripts/snapshot -p 'test_*.py' -v 2>&1 | tee "$VERIFICATION_OUTPUT/regression/snapshot.txt"
          python -m unittest discover -s scripts/tests -p 'test_*.py' -v 2>&1 | tee "$VERIFICATION_OUTPUT/regression/restore.txt"
      - name: Install real browser engines
        working-directory: scripts/browser
        run: npx --no-install playwright install --with-deps chromium firefox
      - name: Freeze bound public news and build both revisions
        id: prepare
        run: |
          for variant in baseline candidate; do
            root="$GITHUB_WORKSPACE/verification-inputs/$variant"
            GITHUB_SHA="$(git -C "$root" rev-parse HEAD)" node "$root/scripts/write-release.mjs"
          done
          node scripts/browser/prepare.mjs
      - name: Browser, offline and same-origin upgrade tests
        working-directory: scripts/browser
        run: npm test
      - name: Alternating same-input startup comparison
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && inputs.run_performance }}
        run: |
          export CHROME_PATH="$(command -v google-chrome)"
          test -n "$CHROME_PATH"
          node scripts/browser/performance.mjs
      - name: Preserve every run, frozen input and failure trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-browser-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci-browser-verification/
          retention-days: 14
          if-no-files-found: warn
